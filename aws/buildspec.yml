version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - pip3 install --upgrade awscli
      - aws --version
      - $(aws ecr get-login --no-include-email --region us-west-2)
      - echo $REMOTE_REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "ECS_CLUSTER_NAME = ${ECS_CLUSTER_NAME}"
      - echo "ECS_SERVICE_NAME = ${ECS_SERVICE_NAME}"
      - echo "ECS_TASK_NAME    = ${ECS_TASK_NAME}"
      - echo "CONTAINER_NAME   = ${CONTAINER_NAME}"
      - export EXECUTE_TEST="1"
  build:
    commands: 
      - chmod a+x ./aws/bash_scripts/build.sh
      - ./aws/bash_scripts/build.sh
      - TEST_RESULT=$(python3 ./aws/python_scripts/getResult.py "./aws/test_result.txt" "${EXECUTE_TEST}" "0")
      - TEST_RESULT_STATUS=$(python3 ./aws/python_scripts/getResult.py "./aws/test_result_status.txt" "${EXECUTE_TEST}" "1")
      - echo "Test Result = ${TEST_RESULT}"
      - echo "Test Result Status = ${TEST_RESULT_STATUS}"
  post_build:
    commands:
      - chmod a+x ./aws/bash_scripts/updateGitStatuses.sh
      - |
        if [ "${TEST_RESULT_STATUS}" -eq "1" ] && [ "${CODEBUILD_BUILD_SUCCEEDING}" -eq "1" ]; then
            ./aws/bash_scripts/updateGitStatuses.sh "1" "${TEST_RESULT}"
        else
            ./aws/bash_scripts/updateGitStatuses.sh "0" "${TEST_RESULT}"
        fi