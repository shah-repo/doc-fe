    #If you specify runtime-versions and use an image other than Ubuntu standard image 2.0, the build fails.
    #runtime-versions:
      # name: version
      # name: version
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  pre_build:
    commands:
      - docker-compose up #--force-recreate because local test run
  build:
    commands:
      - docker ps
      - docker exec -w /opt/app/tests doc-fe_test_run_container_1 ls
      - docker exec -w /opt/app/tests doc-fe_test_run_container_1 ./scripts/cypress/utils/start_tests.sh
