pipelines:
  const:
    common: &COMMON
      image: 
        name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe_test-1.1
        aws:
          access-key: $AWS_ACCESS_KEY_ID
          secret-key: $AWS_SECRET_ACCESS_KEY
      max-time: 20
      caches:
        - node

    common-build: &COMMON_BUILD
      image: 
        name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.1
        aws:
          access-key: $AWS_ACCESS_KEY_ID
          secret-key: $AWS_SECRET_ACCESS_KEY
      max-time: 20
      size: 2x
      caches:
        - node

    common-deploy: &COMMON_DEPLOY
      image: 
        name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.1
        aws:
          access-key: $AWS_ACCESS_KEY_ID
          secret-key: $AWS_SECRET_ACCESS_KEY
      max-time: 10
      size: 2x
      caches:
        - docker
      services:
        - docker

    tests: &RUN_TESTS
      <<: *COMMON
      name: Tests
      size: 2x
      caches:
        - node
        - jest-cache
      artifacts:
        - test-results/**
      script:
        - chmod a+x ./aws/bash_scripts/runTests.sh
        - ./aws/bash_scripts/runTests.sh

    lint: &RUN_LINTER
      <<: *COMMON
      name: Linter
      artifacts:
        - tslint-results/**
      script:
        - chmod a+x ./aws/bash_scripts/runLinter.sh
        - ./aws/bash_scripts/runLinter.sh

#
# Common
#

    lint_and_tests: &LINT_AND_TEST
      - step: *RUN_TESTS
      - step: *RUN_LINTER

#
# DEV
#

    build_dev: &BUILD_DEV
      <<: *COMMON_BUILD
      name: Building for Dev
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "dev"
      artifacts:
        - compiled.tar.gz

    deploy_dev: &DEPLOY_TO_DEV
      <<: *COMMON_DEPLOY
      name: Deploy to Development
      deployment: Development
      script:
        - chmod a+x ./aws/bash_scripts/publish.sh
        - ./aws/bash_scripts/publish.sh "dev"

    test_build_dev: &TEST_AND_BUILD_FOR_DEV
      - step: *RUN_TESTS
      - step: *RUN_LINTER
      - step: *BUILD_DEV

#
# DEV 2
#

    build_dev2: &BUILD_DEV2
      <<: *BUILD_DEV
      name: Building for Dev2
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "dev2"
      artifacts:
        - compiled.tar.gz

    deploy_dev2: &DEPLOY_TO_DEV2
      <<: *DEPLOY_TO_DEV
      name: Deploy to Development 2
      script:
        - chmod a+x ./aws/bash_scripts/publish.sh
        - ./aws/bash_scripts/publish.sh "dev2"

    test_build_dev2: &TEST_AND_BUILD_FOR_DEV2
      - step: *RUN_TESTS
      - step: *RUN_LINTER
      - step: *BUILD_DEV2

#
# Demo
#

    build_demo: &BUILD_DEMO
      <<: *COMMON_BUILD
      name: Building for Demo
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "demo"
      artifacts:
        - compiled.tar.gz

    deploy_demo: &DEPLOY_TO_DEMO
      <<: *COMMON_DEPLOY
      name: Deploy to Demo
      deployment: Demo
      script:
        - chmod a+x ./aws/bash_scripts/publish.sh
        - ./aws/bash_scripts/publish.sh "demo"
      trigger: manual

    test_build_demo: &TEST_AND_BUILD_FOR_DEMO
      - step: *RUN_TESTS
      - step: *RUN_LINTER
      - step: *BUILD_DEMO

#
# Prod
#

    build_prod: &BUILD_PROD
      <<: *COMMON_BUILD
      name: Building for Production
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "prod"
      artifacts:
        - compiled.tar.gz

    deploy_prod: &DEPLOY_TO_PROD
      <<: *COMMON_DEPLOY
      name: Deploy to Production
      deployment: Production
      script:
        - chmod a+x ./aws/bash_scripts/publish.sh
        - ./aws/bash_scripts/publish.sh "prod"
      trigger: manual

    test_build_prod: &TEST_AND_BUILD_FOR_PROD
      - step: *RUN_TESTS
      - step: *RUN_LINTER
      - step: *BUILD_PROD

#
# 
#

  default:
    - parallel: *TEST_AND_BUILD_FOR_DEV
    - step: *DEPLOY_TO_DEV

  tags:
    deploy-to-dev:
      - step: *DEPLOY_TO_DEV
    deploy-to-dev2:
      - step: *DEPLOY_TO_DEV2
    deploy-to-demo:
      - parallel: *LINT_AND_TEST
      - step: *DEPLOY_TO_DEMO
    deploy-to-prod:
      - parallel: *LINT_AND_TEST
      - step: *DEPLOY_TO_PROD

  branches:
    master:
      - parallel: *TEST_AND_BUILD_FOR_PROD
      - step: *DEPLOY_TO_PROD
    develop:
      - parallel: *TEST_AND_BUILD_FOR_DEV
      - step: *DEPLOY_TO_DEV
    develop2:
      - parallel: *TEST_AND_BUILD_FOR_DEV2
      - step: *DEPLOY_TO_DEV2
    release/20.2:
      - parallel: *TEST_AND_BUILD_FOR_DEMO
      - step: *DEPLOY_TO_DEMO

definitions:
  services:
    docker:
      memory: 3072
  caches:
    jest-cache: ./jest-cache