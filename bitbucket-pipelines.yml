clone:
  depth: 10

definitions:
  caches:

  steps:
    - step: &COMMON
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe_test-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        caches:
          - node

    - step: &COMMON_BUILD
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        size: 2x
        caches:
          - node

    - step: &COMMON_DEPLOY
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 10
        caches:
          - docker
        services:
          - docker

    - step: &RUN_LINTER
        <<: *COMMON
        name: Linter
        artifacts:
          - eslint-results/**
        script:
          - yarn install --frozen-lockfile
          - ./aws/bash_scripts/runUnusedExportsCheck.sh
          - ./aws/bash_scripts/runLinter.sh

    - step: &RUN_TESTS
        <<: *COMMON
        name: Tests
        size: 2x
        caches:
          - node
        artifacts:
          - test-results/**
          - jest-config/**
        script:
          - yarn install --frozen-lockfile
          - ./aws/bash_scripts/runTests.sh
    #
    # DEV
    #
    - step: &BUILD_DEV
        <<: *COMMON_BUILD
        name: Building for Dev
        script:
          - ./aws/bash_scripts/build.sh "dev"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV
        <<: *COMMON_DEPLOY
        name: Deploy to Dev
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev"
    #
    # DEV2
    #
    - step: &BUILD_DEV2
        <<: *COMMON_BUILD
        name: Building for Dev2
        script:
          - ./aws/bash_scripts/build.sh "dev2"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV2
        <<: *COMMON_DEPLOY
        name: Deploy to Dev2
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev2"
    #
    # DEMO
    #
    - step: &BUILD_DEMO
        <<: *COMMON_BUILD
        name: Building for Demo
        script:
          - ./aws/bash_scripts/build.sh "demo"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEMO
        <<: *COMMON_DEPLOY
        name: Deploy to Demo
        deployment: Demo
        script:
          - ./aws/bash_scripts/publish.sh "demo"
    #
    # PROD
    #
    - step: &BUILD_PROD
        <<: *COMMON_BUILD
        name: Building for Prod
        script:
          - ./aws/bash_scripts/build.sh "prod"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_PROD
        <<: *COMMON_DEPLOY
        name: Deploy to Prod
        deployment: Production
        script:
          - ./aws/bash_scripts/publish.sh "prod"
        trigger: manual
    #
    # SANDBOX
    #
    - step: &BUILD_SANDBOX
        <<: *COMMON_BUILD
        name: Building for Sandbox
        script:
          - ./aws/bash_scripts/build.sh "sandbox"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_SANDBOX
        <<: *COMMON_DEPLOY
        name: Deploy to Sandbox
        deployment: Sandbox
        script:
          - ./aws/bash_scripts/publish.sh "sandbox"
        trigger: manual
#
# Pipelines
#
pipelines:
  # pull-requests:
  #   "**":
  #     - parallel:
  #         - step: *RUN_TESTS
  #         - step: *RUN_LINTER

  tags:
    deploy-to-dev:
      - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    deploy-to-dev2:
      - step: *BUILD_DEV2
      - step: *DEPLOY_DEV2

    deploy-to-demo:
      - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO

    deploy-to-prod:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    deploy-to-sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX

  branches:
    master:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    develop:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX

    release/21.1:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO
