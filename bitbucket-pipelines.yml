clone:
  depth: 10

definitions:
  services:
    sorry-cypress-director:
      image:
        name: agoldis/sorry-cypress-director:latest
      memory: 512
      variables:
        EXECUTION_DRIVER: "../execution/in-memory"
        SCREENSHOTS_DRIVER: "../screenshots/dummy.driver"
      ports:
        - 1234:1234
    docker:
      memory: 512
  caches:

  steps:
    - step: &COMMON
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe_test-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        caches:
          - node

    - step: &COMMON_BUILD
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        size: 2x
        caches:
          - node

    - step: &COMMON_DEPLOY
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 10
        caches:
          - docker
        services:
          - docker

    - step: &RUN_LINTER
        <<: *COMMON
        name: Linter
        artifacts:
          - eslint-results/**
        script:
          - ./aws/bash_scripts/runLinter.sh

    - step: &RUN_TESTS
        <<: *COMMON
        name: Tests
        size: 2x
        caches:
          - node
        artifacts:
          - test-results/**
          - jest-config/**
        script:
          - ./aws/bash_scripts/runTests.sh
    #
    # DEV
    #
    - step: &BUILD_DEV
        <<: *COMMON_BUILD
        name: Building for Dev
        script:
          - ./aws/bash_scripts/build.sh "dev"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV
        <<: *COMMON_DEPLOY
        name: Deploy to Dev
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev"
    #
    # DEV2
    #
    - step: &BUILD_DEV2
        <<: *COMMON_BUILD
        name: Building for Dev2
        script:
          - ./aws/bash_scripts/build.sh "dev2"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV2
        <<: *COMMON_DEPLOY
        name: Deploy to Dev2
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev2"
    #
    # DEMO
    #
    - step: &BUILD_DEMO
        <<: *COMMON_BUILD
        name: Building for Demo
        script:
          - ./aws/bash_scripts/build.sh "demo"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEMO
        <<: *COMMON_DEPLOY
        name: Deploy to Demo
        deployment: Demo
        script:
          - ./aws/bash_scripts/publish.sh "demo"
    #
    # PROD
    #
    - step: &BUILD_PROD
        <<: *COMMON_BUILD
        name: Building for Prod
        script:
          - ./aws/bash_scripts/build.sh "prod"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_PROD
        <<: *COMMON_DEPLOY
        name: Deploy to Prod
        deployment: Production
        script:
          - ./aws/bash_scripts/publish.sh "prod"
        trigger: manual
    #
    # SANDBOX
    #
    - step: &BUILD_SANDBOX
        <<: *COMMON_BUILD
        name: Building for Sandbox
        script:
          - ./aws/bash_scripts/build.sh "sandbox"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_SANDBOX
        <<: *COMMON_DEPLOY
        name: Deploy to Sandbox
        deployment: Sandbox
        script:
          - ./aws/bash_scripts/publish.sh "sandbox"
        trigger: manual
#
# Pipelines
#
pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER

  tags:
    deploy-to-dev:
      - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    deploy-to-dev2:
      - step: *BUILD_DEV2
      - step: *DEPLOY_DEV2

    deploy-to-demo:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO

    deploy-to-prod:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    deploy-to-sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX

  branches:
    master:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    develop:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX

    release/20.26:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO
    
    ENC-5912:
      - variables:
          CI_BUILD_ID: "some_ci_build_id"
          CYPRESS_BE_URL: "https://api.dev.enlil.io"
          CYPRESS_FE_URL: "https://dev.enlil.io"
          CYPRESS_BROWSER: "chrome"
          NUMBER_OF_WORKERS: 2
          REPORT_TITLE: "generated_specs"
          CYPRESS_INTEGRATION_FOLDER: "cypress/integration/group.management"
          CYPRESS_SKIP_ON_RUN_FAILURE: true
          CYPRESS_TAKE_SCREENSHOT_AFTER_EACH: false
          CYPRESS_SCREENSHOT_OF_RUN_FAILURE: true
          CYPRESS_SUPERADMIN_EMAIL: "zoran.kovacevic+admin@codecons.com"
          CYPRESS_SUPERADMIN_PASSWORD: "Tester1!"
          CYPRESS_VIDEO: false
          DIR_JSON: "test-results/some_ci_build_id/json"
          DIR_REPORTS: "test-results/some_ci_build_id/reports"
          DIR_SCREENSHOTS: "test-results/some_ci_build_id/reports/screenshots"
          DIR_SCREENSHOTS_REPORT: "test-results/some_ci_build_id/reports/screenshots"
          CYPRESS_SCREENSHOTS_FOLDER: "test-results/some_ci_build_id/reports/screenshots"
          DIR_VIDEOS_REPORT: "test-results/some_ci_build_id/reports/videos"
          CYPRESS_VIDEOS_FOLDER: "test-results/some_ci_build_id/reports/videos"
      - step:
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:run_cypress_specs1
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 10
        caches:
          - node
        name: Cypress specs
        size: 1x
        artifacts:
          - test-results/**
        script:
          - ./scripts/cypress/utils/patch_director_port_in_cache_pipeline.sh
          - mv cypress_docker.json cypress.json
          - yarn install --frozen-lockfile
          - ./scripts/cypress/utils/make_results_dir_pipeline.sh
          - ./scripts/cypress/utils/run_generate_info_report_pipeline.sh
          - ./scripts/cypress/utils/run_workers_in_parallel_pipeline.sh
          - ./scripts/cypress/utils/run_generate_requirements_report_pipeline.sh
          - ./scripts/cypress/utils/merge_reports_pipeline.sh
      