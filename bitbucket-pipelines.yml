options:
  size: 2x
  docker: true

pipelines:
  const:
    tests: &RUN_TESTS
      name: Tests
      image: node:10 
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/runTests.sh
        - ./aws/bash_scripts/runTests.sh
      after-script:
        - python3 ./aws/python_scripts/processTestResults.py ./test-results/test.json

    deploy_to_development: &DEPLOY_TO_DEVELOPMENT
      name: Deploying to Development
      image: python:3   
      deployment: Development
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "dev"

    deploy_to_production: &DEPLOY_TO_PRODUCTION
      name: Deploying to Production
      image: python:3   
      deployment: Production
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "prod"

    deploy_to_demo: &DEPLOY_TO_DEMO
      name: Deploying to Demo
      image: python:3   
      deployment: Demo
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "demo"

  default:
      - step: *RUN_TESTS
  tags:
    deploy-to-dev:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOPMENT
    deploy-to-demo:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEMO
    deploy-to-prod:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_PRODUCTION
  branches:
    master:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_PRODUCTION
    develop:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOPMENT
    infrastructure:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOPMENT
    demo:
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEMO
      
definitions:
  services:
    docker:
      memory: 3096