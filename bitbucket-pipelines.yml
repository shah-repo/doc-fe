clone:
  depth: 10

definitions:
  services:
    sorry-cypress-director:
      image:
        name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:sorry-cypress-director-3-retries
      variables:
        EXECUTION_DRIVER: "../execution/in-memory"
        SCREENSHOTS_DRIVER: "../screenshots/dummy.driver"
      ports:
        - 1234:1234
  caches:
  steps:
    - step: &COMMON
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe_test-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        caches:
          - node

    - step: &COMMON_BUILD
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        size: 2x
        caches:
          - node

    - step: &COMMON_DEPLOY
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-1.3
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 10
        caches:
          - docker
        services:
          - docker

    - step: &RUN_LINTER
        <<: *COMMON
        name: Linter
        artifacts:
          - eslint-results/**
        script:
          - NODE_ENV=development yarn install --frozen-lockfile
          - ./aws/bash_scripts/runUnusedExportsCheck.sh
          - ./aws/bash_scripts/runLinter.sh

    - step: &RUN_TESTS
        <<: *COMMON
        name: Tests
        size: 2x
        caches:
          - node
        artifacts:
          - test-results/**
          - jest-config/**
        script:
          - NODE_ENV=development yarn install --frozen-lockfile
          - ./aws/bash_scripts/runTests.sh

    - step: &COMMON_UPLOAD_CYPRESS_REPORT
        name: Cypress upload reports
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:run_cypress_specs_node_14_10_0_chrome_88_cy_6_2_0_aws
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 30
        size: 2x
        services:
          - sorry-cypress-director
        caches:
          - node
        artifacts:
          - test-results/**
          - zipped-test-results/**
        script:
          - source ./scripts/cypress/utils/variables_pipeline.sh
          - ./scripts/cypress/utils/run_generate_requirements_report_pipeline.sh
          - ./scripts/cypress/utils/merge_reports_pipeline.sh
          - ./scripts/cypress/utils/upload_video_reports.sh

    - step: &COMMON_RUN_CYPRESS
          name: Cypress specs
          image:
            name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:run_cypress_specs_node_14_10_0_chrome_88_cy_6_2_0_aws
            aws:
              access-key: $AWS_ACCESS_KEY_ID
              secret-key: $AWS_SECRET_ACCESS_KEY
          max-time: 30
          size: 2x
          services:
            - sorry-cypress-director
          caches:
            - node
          artifacts:
            - test-results/**
          script:
            - source ./scripts/cypress/utils/variables_pipeline.sh
            - ./scripts/cypress/utils/patch_director_port_in_cache_pipeline.sh
            - yarn install --frozen-lockfile
            - ./scripts/cypress/utils/make_results_dir_pipeline.sh
            - ./scripts/cypress/utils/generate_requirements_json_file.sh
            - ./scripts/cypress/utils/run_generate_info_report_pipeline.sh
            - ./scripts/cypress/utils/run_workers_in_parallel_pipeline.sh
            - ./scripts/cypress/utils/run_generate_requirements_report_pipeline.sh
            - ./scripts/cypress/utils/merge_reports_pipeline.sh
            - ./scripts/cypress/utils/exit_1_if_failures.sh

    - parallel: &RUN_CYPRESS_IN_PARALLEL
        - step: 
            <<:  *COMMON_RUN_CYPRESS
            name: Cypress specs 1/4
        - step: 
            <<:  *COMMON_RUN_CYPRESS
            name: Cypress specs 2/4
        - step: 
            <<:  *COMMON_RUN_CYPRESS
            name: Cypress specs 3/4
        - step: 
            <<:  *COMMON_RUN_CYPRESS
            name: Cypress specs 4/4
        # - step: 
        #     <<:  *COMMON_RUN_CYPRESS
        #     name: Cypress specs 5/4
        # - step: 
        #     <<:  *COMMON_RUN_CYPRESS
        #     name: Cypress specs 6/4
        # - step: 
        #     <<:  *COMMON_RUN_CYPRESS
        #     name: Cypress specs 7/8
        # - step: 
        #     <<:  *COMMON_RUN_CYPRESS
        #     name: Cypress specs 8/8

    - step: &RUN_CYPRESS_SINGLE
        <<:  *COMMON_RUN_CYPRESS
        name: Cypress specs 1/1
    #
    # DEV
    #
    - step: &BUILD_DEV
        <<: *COMMON_BUILD
        name: Building for Dev
        script:
          - ./aws/bash_scripts/build.sh "dev"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV
        <<: *COMMON_DEPLOY
        name: Deploy to Dev
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev"
    #
    # DEV2
    #
    - step: &BUILD_DEV2
        <<: *COMMON_BUILD
        name: Building for Dev2
        script:
          - ./aws/bash_scripts/build.sh "dev2"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV2
        <<: *COMMON_DEPLOY
        name: Deploy to Dev2
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev2"
    #
    # DEMO
    #
    - step: &BUILD_DEMO
        <<: *COMMON_BUILD
        name: Building for Demo
        script:
          - ./aws/bash_scripts/build.sh "demo"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEMO
        <<: *COMMON_DEPLOY
        name: Deploy to Demo
        deployment: Demo
        script:
          - ./aws/bash_scripts/publish.sh "demo"
    #
    # PROD
    #
    - step: &BUILD_PROD
        <<: *COMMON_BUILD
        name: Building for Prod
        script:
          - ./aws/bash_scripts/build.sh "prod"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_PROD
        <<: *COMMON_DEPLOY
        name: Deploy to Prod
        deployment: Production
        script:
          - ./aws/bash_scripts/publish.sh "prod"
        trigger: manual
    #
    # SANDBOX
    #
    - step: &BUILD_SANDBOX
        <<: *COMMON_BUILD
        name: Building for Sandbox
        script:
          - ./aws/bash_scripts/build.sh "sandbox"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_SANDBOX
        <<: *COMMON_DEPLOY
        name: Deploy to Sandbox
        deployment: Sandbox
        script:
          - ./aws/bash_scripts/publish.sh "sandbox"
        trigger: manual
#
# Pipelines
#
pipelines:
  custom: 
    run-cypress-on-dev-bbrun-single:
      - variables:
          - name: CYPRESS_FE_URL
          - name: CYPRESS_BE_URL
          - name: CYPRESS_SUPERADMIN_EMAIL
          - name: CYPRESS_SUPERADMIN_PASSWORD
          - name: CYPRESS_COMMIT_FE
          - name: CYPRESS_COMMIT_BE
          - name: CYPRESS_COMMIT_REMOTEJS
      - step: 
          <<:  *COMMON_RUN_CYPRESS
          name: Cypress specs local test
    run-cypress-on-dev-bbrun-parallel:
      - variables:
          - name: CYPRESS_FE_URL
          - name: CYPRESS_BE_URL
          - name: CYPRESS_SUPERADMIN_EMAIL
          - name: CYPRESS_SUPERADMIN_PASSWORD
          - name: CYPRESS_COMMIT_FE
          - name: CYPRESS_COMMIT_BE
          - name: CYPRESS_COMMIT_REMOTEJS
      - parallel: *RUN_CYPRESS_IN_PARALLEL
      - step: *COMMON_UPLOAD_CYPRESS_REPORT

  pull-requests:
    "**":
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER

  tags:
    deploy-to-dev:
      - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    deploy-to-dev2:
      - step: *BUILD_DEV2
      - step: *DEPLOY_DEV2

    deploy-to-demo:
      - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO

    deploy-to-prod:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    deploy-to-sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX
    
    run-parallel-cypress-on-dev:
      - parallel: *RUN_CYPRESS_IN_PARALLEL
    
    run-single-cypress-on-dev:
      - step: *RUN_CYPRESS_SINGLE

  branches:
    master:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

    develop:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    sandbox:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_SANDBOX
      - step: *DEPLOY_SANDBOX

    release/21.3:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_LINTER
          - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO
