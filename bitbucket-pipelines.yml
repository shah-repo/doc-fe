options:
  size: 2x
  docker: true

pipelines:
  const:
    tests: &RUN_TESTS
      name: Tests
      image: node:10 
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/runTests.sh
        - ./aws/bash_scripts/runTests.sh

    lint_tests: &RUN_LINT_AND_TESTS
      name: Linter & Tests
      image: node:10
      services:
        - docker
      caches:
        - docker
        - node
      script:
        - chmod a+x ./aws/bash_scripts/runLinter.sh
        - ./aws/bash_scripts/runLinter.sh
        - chmod a+x ./aws/bash_scripts/runTests.sh
        - ./aws/bash_scripts/runTests.sh

    lint: &RUN_LINTER
      name: Linter
      image: node:10
      services:
        - docker
      caches:
        - docker
        - node
      script:
        - chmod a+x ./aws/bash_scripts/runLinter.sh
        - ./aws/bash_scripts/runLinter.sh

    deploy_to_development: &DEPLOY_TO_DEVELOP_1
      name: Deploy to Development 1
      image: python:3   
      deployment: Development
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "dev"

    deploy_to_development: &DEPLOY_TO_DEVELOP_2
      <<: *DEPLOY_TO_DEVELOP_1
      name: Deploy to Development 2
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "dev2"

    deploy_to_production: &DEPLOY_TO_PRODUCTION
      name: Deploy to Production
      image: python:3   
      deployment: Production
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "prod"

    deploy_to_demo: &DEPLOY_TO_DEMO
      name: Deploy to Demo
      image: python:3   
      deployment: Demo
      services:
        - docker
      caches:
        - docker
      script:
        - chmod a+x ./aws/bash_scripts/build.sh
        - ./aws/bash_scripts/build.sh "demo"

  default:
      - step: *RUN_LINT_AND_TESTS
  tags:
    deploy-to-dev:
      - step: *RUN_LINT_AND_TESTS
      - step: *DEPLOY_TO_DEVELOP_1
    deploy-to-dev2:
      - step: *RUN_LINT_AND_TESTS
      - step: *DEPLOY_TO_DEVELOP_2
    deploy-to-demo:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEMO
    deploy-to-prod:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_PRODUCTION
  branches:
    master:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_PRODUCTION
    develop:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOP_1
    develop2:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOP_2
    infrastructure:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEVELOP_1
    release/19.3:
      - step: *RUN_LINTER
      - step: *RUN_TESTS
      - step: *DEPLOY_TO_DEMO
      
definitions:
  services:
    docker:
      memory: 3096
