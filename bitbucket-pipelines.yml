clone:
  depth: 10

definitions:
  caches:
    yarn-node-modules:
      key:
        files:
          - yarn.lock
      path: ./node_modules

  steps:
    - step: &COMMON
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe_test-2.6
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        size: 2x
        caches:
          - yarn-node-modules

    - step: &COMMON_BUILD
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-2.6
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 20
        size: 2x
        caches:
          - yarn-node-modules

    - step: &COMMON_DEPLOY
        image:
          name: 817083319299.dkr.ecr.us-west-2.amazonaws.com/shifamed:build_image_fe-2.6
          aws:
            access-key: $AWS_ACCESS_KEY_ID
            secret-key: $AWS_SECRET_ACCESS_KEY
        max-time: 10
        caches:
          - docker
        services:
          - docker

    - step: &RUN_TYPECHECK
        <<: *COMMON
        name: Typecheck
        artifacts:
          - typecheck-results/**
        script:
          - NODE_ENV=development yarn install --frozen-lockfile
          - yarn lint:tsc

    - step: &RUN_LINTER
        <<: *COMMON
        name: Linter
        artifacts:
          - eslint-results/**
        script:
          - NODE_ENV=development yarn install --frozen-lockfile
          - ./aws/bash_scripts/runUnusedExportsCheck.sh
          - ./aws/bash_scripts/runLinter.sh

    - step: &RUN_TESTS
        <<: *COMMON
        name: Tests
        caches:
          - yarn-node-modules
        artifacts:
          - test-results/**
          - jest-config/**
        script:
          - NODE_ENV=development yarn install --frozen-lockfile
          - ./aws/bash_scripts/runTests.sh

    #
    # DEV
    #
    - step: &BUILD_DEV
        <<: *COMMON_BUILD
        name: Building for Dev
        script:
          - ./aws/bash_scripts/build.sh "dev"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEV
        <<: *COMMON_DEPLOY
        name: Deploy to Dev
        deployment: Development
        script:
          - ./aws/bash_scripts/publish.sh "dev"
    #
    # DEMO
    #
    - step: &BUILD_DEMO
        <<: *COMMON_BUILD
        name: Building for Demo
        script:
          - ./aws/bash_scripts/build.sh "demo"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_DEMO
        <<: *COMMON_DEPLOY
        name: Deploy to Demo
        deployment: Demo
        script:
          - ./aws/bash_scripts/publish.sh "demo"
    #
    # PROD
    #
    - step: &BUILD_PROD
        <<: *COMMON_BUILD
        name: Building for Prod
        script:
          - ./aws/bash_scripts/build.sh "prod"
        artifacts:
          - compiled.tar.gz

    - step: &DEPLOY_PROD
        <<: *COMMON_DEPLOY
        name: Deploy to Prod
        deployment: Production
        script:
          - ./aws/bash_scripts/publish.sh "prod"
        trigger: manual
#
# Pipelines
#
pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_TYPECHECK
          - step: *RUN_LINTER
          - step: *BUILD_DEV

  custom:
    build_and_deploy_with_options_and_no_tests:
      - variables:
          - name: Environment
            default: dev
            allowed-values:
              - dev
              - dev2
              - dev3
              - demo
              - sandbox
              - prod2
              - prod3
              - prod4
      - step:
          <<: *COMMON_BUILD
          name: Building
          script:
            - ./aws/bash_scripts/build.sh "$Environment"
          artifacts:
            - compiled.tar.gz
      - step:
          <<: *COMMON_DEPLOY
          name: Deploying
          deployment: General
          script:
            - ./aws/bash_scripts/publish.sh "$Environment"

    build_and_deploy_with_options:
      - variables:
          - name: Environment
            default: dev
            allowed-values:
              - dev
              - dev2
              - dev3
              - demo
              - sandbox
              - prod2
              - prod3
              - prod4
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_TYPECHECK
          - step: *RUN_LINTER
          - step:
              <<: *COMMON_BUILD
              name: Building
              script:
                - ./aws/bash_scripts/build.sh "$Environment"
              artifacts:
                - compiled.tar.gz
      - step:
          <<: *COMMON_DEPLOY
          name: Deploying
          deployment: General
          script:
            - ./aws/bash_scripts/publish.sh "$Environment"

  branches:
    develop:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_TYPECHECK
          - step: *RUN_LINTER
          - step: *BUILD_DEV
      - step: *DEPLOY_DEV

    demo:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_TYPECHECK
          - step: *RUN_LINTER
          - step: *BUILD_DEMO
      - step: *DEPLOY_DEMO

    master:
      - parallel:
          - step: *RUN_TESTS
          - step: *RUN_TYPECHECK
          - step: *RUN_LINTER
          - step: *BUILD_PROD
      - step: *DEPLOY_PROD

