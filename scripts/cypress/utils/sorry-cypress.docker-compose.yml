version: "3.5"

services:
  enlil_cypress_dashboard_mongo:
    image: mongo:4.0
    expose:
      - 27017
  enlil_cypress_redis:
    image: redis:6.2.4-alpine
  enlil_cypress_dashboard_director:
    image: agoldis/sorry-cypress-director:1.0.0-rc.10
    environment:
      DASHBOARD_URL: "http://localhost:${ENLIL_COMPOSE_EXPOSE_SORRY_CY_DASHBOARD_PORT}"
      MONGODB_URI: "mongodb://enlil_cypress_dashboard_mongo:27017"
      MONGODB_DATABASE: "sorry-cypress"
      EXECUTION_DRIVER: "../execution/mongo/driver"
      SCREENSHOTS_DRIVER: "../screenshots/dummy.driver"
      REDIS_URI: 'redis://enlil_cypress_redis:6379'
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_SORRY_CY_DIRECTOR_PORT}:1234
    depends_on:
      - enlil_cypress_dashboard_mongo
  enlil_cypress_dashboard_api:
    image: agoldis/sorry-cypress-api:1.0.0-rc.10
    environment:
      MONGODB_URI: "mongodb://enlil_cypress_dashboard_mongo:27017"
      MONGODB_DATABASE: "sorry-cypress"
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_SORRY_CY_API_PORT}:4000
    depends_on:
      - enlil_cypress_dashboard_mongo
  enlil_cypress_dashboard_server:
    image: agoldis/sorry-cypress-dashboard:1.0.0-rc.10
    environment:
      GRAPHQL_SCHEMA_URL: "http://localhost:${ENLIL_COMPOSE_EXPOSE_SORRY_CY_API_PORT}"
      GRAPHQL_CLIENT_CREDENTIALS: ''
      CI_URL: ''
      PORT: 8080
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_SORRY_CY_DASHBOARD_PORT}:8080
    depends_on:
      - enlil_cypress_dashboard_mongo
      - enlil_cypress_dashboard_api
