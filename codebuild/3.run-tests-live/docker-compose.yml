version: "3.9"  # optional since v1.27.0
x-const:
  be_env_vars: &BE_ENV_VARS
    - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    #- AWS_CONTAINER_CREDENTIALS_RELATIVE_URI=${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}

services:
  director:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:sorry-cypress-director-3-retries-v1.1.1
    ports:
      - 1234:1234
    networks:
      cypress_network:
        aliases: 
          - director

  test_run_container:
    #image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:run_cypress_specs_node_14_10_0_chrome_92_cy_8_3_1_aws
    image: test_ts-node:latest
    command: tail -F anything
    volumes:
      - "$FE_REPO:/opt/app/tests"
    networks:
      cypress_network:
    depends_on:
      - enlil_fe_server
      
networks:
  cypress_network:
    name: cypress_network