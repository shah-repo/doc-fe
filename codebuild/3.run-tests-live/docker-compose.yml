version: "3.8"
services:
  director:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:sorry-cypress-director-n-retries-v1.1.1
    ports:
      - 1234:1234
    environment:
    - NUMBER_OF_SPEC_RETRIES=${NUMBER_OF_SPEC_RETRIES}
    networks:
      cypress_network:
        aliases: 
          - director

  test_run_container:
    container_name: enlil_cypress_test_run_container
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:run_cypress_specs_node_14_10_0_chrome_92_cy_8_3_1_aws
    command: tail -F anything
    volumes:
      - "$FE_REPO:/opt/app"
    networks:
      cypress_network:
    environment:
    - NUMBER_OF_WORKERS=${NUMBER_OF_WORKERS}
    - ENLIL_ENV=${ENLIL_ENV}
    - SLACK_TOKEN=${SLACK_TOKEN}
    shm_size: 2GB
networks:
  cypress_network:
    name: cypress_network
