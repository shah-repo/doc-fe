version: 0.2

env:
  shell: bash
  variables: 
    COMPOSE_PROJECT_NAME: "enlil_codebuild"
  exported-variables:
    - AWS_DEFAULT_REGION
    - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
phases:
  install:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ls
  pre_build:
    commands:
      - cd codebuild/3.run-tests-live/
      - docker-compose up -d
  build:
    commands:
      - docker ps
      - docker exec -w /opt/app/tests enlil_codebuild_test_run_container_1 ls
      - docker exec -w /opt/app/tests enlil_codebuild_test_run_container_1 ./codebuild/3.run-tests-live/start_tests.sh
  post_build:
    commands:
      # - docker logs enlil_codebuild_enlil_cypress_server_1 &> ./test-results/some_ci_build_id/server_logs.txt
      # - docker logs enlil_codebuild_enlil_cypress_worker_1 &> ./test-results/some_ci_build_id/worker_logs.txt
      - ls
reports:
  report-name-or-arn:
    files:
      - '**/*'
    base-directory: test-results/some_ci_build_id/json/junit
    file-format: JunitXml
artifacts:
  files:
    - test-results/some_ci_build_id/**/*