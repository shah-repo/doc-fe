version: 0.2

env:
  shell: bash
  exported-variables:
     - AWS_DEFAULT_REGION
     - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
phases:
  pre_build:
    commands:
      - export FE_REPO="$CODEBUILD_SRC_DIR"
      - export BE_REPO="$CODEBUILD_SRC_DIR_backend_code"
      - export VALIDATORS_REPO="$CODEBUILD_SRC_DIR_validators_code"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo $ENLIL_BE_AWS_SQS_QUEUE_URL
  build:
    commands:
      - source $FE_REPO/codebuild/1.build-images/start_build.sh
  post_build:
    commands:
      - ls
      - $FE_REPO/codebuild/1.build-images/export_commit_hashes.sh
      - echo "Done"

artifacts:
  files:
    - $FE_REPO/commit_hashes.json