version: 0.2

env:
  shell: bash
  exported-variables:
    - AWS_DEFAULT_REGION
    - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
phases:
  pre_build:
    commands:
      - set -e
      - export FE_REPO="$CODEBUILD_SRC_DIR"
      # doc-be
      - export BE_REPO="$CODEBUILD_SRC_DIR_backend_code"
      - export BE_GIT_COMMIT_HASH=$(cd $BE_REPO;git rev-parse HEAD | cut -c1-8)
      # doc-export
      - export EXPORT_REPO="$CODEBUILD_SRC_DIR_doc_export_code"
      - export EXPORT_GIT_COMMIT_HASH=$(cd $EXPORT_REPO;git rev-parse HEAD | cut -c1-8)
      # docx-to-pdf
      - export DOCXTOPDF_REPO="$CODEBUILD_SRC_DIR_docx_to_pdf_code"
      - export DOCXTOPDF_GIT_COMMIT_HASH=$(cd $DOCXTOPDF_REPO;git rev-parse HEAD | cut -c1-8)
      # word-service
      - export BUILD_WORD_SERVICE_REPO="$CODEBUILD_SRC_DIR_word_service_code"
      - export WORDSERVICE_GIT_COMMIT_HASH=$(cd $BUILD_WORD_SERVICE_REPO;git rev-parse HEAD | cut -c1-8)
      # print commit hashes
      - $CODEBUILD_SRC_DIR/codebuild/helper/print_hashes.sh
      # docker login
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - source $FE_REPO/codebuild/1.build-images/start_build.sh
  post_build:
    commands:
      - ls
      - $FE_REPO/codebuild/1.build-images/export_commit_hashes.sh
      - echo "Done"

artifacts:
  files:
    - $FE_REPO/commit_hashes.json
