version: 0.2

env:
  shell: bash
  exported-variables:
    - AWS_DEFAULT_REGION
    - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
phases:
  install:
    commands:
      - set -e
      - export FE_REPO="$CODEBUILD_SRC_DIR"
      # load commit hashes from build 1
      - cd $CODEBUILD_SRC_DIR_build_artifacts_1
      - export commits_file_location1=$(find . -name commit_hashes.json)
      - export FE_GIT_COMMIT_HASH=$(jq '.feCommit' $commits_file_location1 | tr -d '"')
      - export VALIDATORS_GIT_COMMIT_HASH=$(jq '.validatorsCommit' $commits_file_location1 | tr -d '"')
      # load commit hashes from build 2
      - cd $CODEBUILD_SRC_DIR_build_artifacts_2
      - export commits_file_location2=$(find . -name commit_hashes.json)
      - export BE_GIT_COMMIT_HASH=$(jq '.beCommit' $commits_file_location2 | tr -d '"')
      - export EXPORT_GIT_COMMIT_HASH=$(jq '.exportCommit' $commits_file_location2 | tr -d '"')
      - export DOCXTOPDF_GIT_COMMIT_HASH=$(jq '.docxtopdfCommit' $commits_file_location2 | tr -d '"')
      - export WORDSERVICE_GIT_COMMIT_HASH=$(jq '.wordServiceCommit' $commits_file_location2 | tr -d '"')
      # print commit hashes
      - $CODEBUILD_SRC_DIR/codebuild/helper/print_hashes.sh
      # docker login
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      # source env variables
      - source $FE_REPO/codebuild/2.run-tests/export_variables.sh
  pre_build:
    commands:
      - cd $DOCKER_COMPOSE_FILE_LOCATION
      - docker-compose up --force-recreate --remove-orphans -d --scale enlil_cypress_server=$ENLIL_CYPRESS_SERVER_SCALE --scale enlil_cypress_worker_replicas=$ENLIL_CYPRESS_WORKER_SCALE
  build:
    commands:
      - docker ps
      - docker exec -w /opt/app enlil_cypress_test_run_container ./codebuild/2.run-tests/start_tests.sh

reports:
  report-name-or-arn:
    files:
      - "**/*"
    base-directory: test-results/some_ci_build_id/json/junit
    file-format: JunitXml
artifacts:
  files:
    - test-results/some_ci_build_id/**/*
