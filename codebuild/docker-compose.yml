version: "3.9"  # optional since v1.27.0
x-const:
  be_env_vars: &BE_ENV_VARS
    # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    # - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI=${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    - AWS_SQS_QUEUE_URL=${ENLIL_BE_AWS_SQS_QUEUE_URL}
    - ENLIL_DB_PERSIST=${ENLIL_DB_PERSIST}
    - ENV_NAME=${ENLIL_BE_ENV_NAME}
    - TYPEORM_DATABASE=${TYPEORM_DATABASE}
    - TYPEORM_HOST=${TYPEORM_HOST}
    - VALIDATORS_CYPRESS_FE_URL=${ENLIL_BE_VALIDATORS_CYPRESS_FE_URL}

  enlil_cypress_worker_config: &ENLIL_CYPRESS_WORKER_CONFIG
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:be_worker_${BE_GIT_COMMIT_HASH}
    networks:
      - cypress_network
    depends_on:
      - enlil_cypress_postgres
      - enlil_cypress_redis
      - enlil_cypress_server
    env_file:
      - be_env.env
    environment:
      *BE_ENV_VARS

services:
  director:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:sorry-cypress-director-3-retries-v1.1.1
    ports:
      - 1234:1234
    networks:
      cypress_network:
        aliases: 
          - director

  test_run_container:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:run_cypress_specs_node_14_10_0_chrome_92_cy_8_3_1_aws
    command: tail -F anything
    volumes:
      - "$FE_REPO:/opt/app/tests"
    networks:
      cypress_network:
    depends_on:
      - enlil_fe_server

  enlil_fe_server:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:fe_${FE_GIT_COMMIT_HASH}
    depends_on:
      - enlil_cypress_server
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_FE_PORT}:4212
    env_file:
      - fe_env.env
    environment:
      REACT_APP_API_ENDPOINT: ${REACT_APP_API_ENDPOINT}
      REACT_APP_FRONTEND_URL: ${REACT_APP_FRONTEND_URL}
      REACT_APP_WORKER_API_ENDPOINT: ${REACT_APP_WORKER_API_ENDPOINT}
    networks:
      cypress_network:
        aliases: 
          - frontend

  enlil_cypress_postgres:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/testing-ecr:enlil_cypress_postgres
    command: postgres -c logging_collector=off
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_POSTGRES_PORT}:5432
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/volume/db-files
    volumes:
      - enlil_cypress_postgres_tmpfs_volume:/var/volume
    networks:
      cypress_network:
        aliases: 
          - postgres
          
  enlil_cypress_validators:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:validators_${VALIDATORS_GIT_COMMIT_HASH}
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_VALIDATORS_PORT}:4215
    expose:
      - 4215
    networks:
      cypress_network:
        aliases: 
          - validators
    environment:
      - PORT=4215

  enlil_cypress_migration:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:be_migration_${BE_GIT_COMMIT_HASH}
    networks:
      - cypress_network
    depends_on:
      - enlil_cypress_postgres
      - enlil_cypress_redis
    expose:
      - 8080
    environment:
      *BE_ENV_VARS
    env_file:
      - be_env.env

  enlil_cypress_worker:
    <<: *ENLIL_CYPRESS_WORKER_CONFIG
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_BE_WORKER_PORT}:4219
    networks:
      cypress_network:
        aliases: 
          - worker

  enlil_cypress_redis:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:redis_4.0.14-alpine
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_REDIS_PORT}:6379
    command: ["redis-server", "--appendonly", "yes"]
    hostname: redis
    volumes:
      - enlil_cypress_redis_volume:/data
    networks:
      cypress_network:
        aliases: 
          - enlil_cypress_redis

  enlil_cypress_server:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:be_server_${BE_GIT_COMMIT_HASH}
    networks:
      - cypress_network
    depends_on:
      - enlil_cypress_postgres
      - enlil_cypress_redis
      - enlil_cypress_migration
    expose:
      - 4211
    environment:
      *BE_ENV_VARS
    env_file:
      - be_env.env

  enlil_cypress_haproxy:
    image: 817083319299.dkr.ecr.us-west-2.amazonaws.com/codebuild:haproxy
    networks:
      cypress_network:
        aliases: 
          - backend
    ports:
      - ${ENLIL_COMPOSE_EXPOSE_HAPROXY_PORT}:80
    depends_on:
      - enlil_cypress_server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment: 
      - BALANCE=leastconn
    links:
      - enlil_cypress_server

volumes:
  enlil_cypress_postgres_tmpfs_volume:
    driver_opts:
      type: tmpfs
      device: tmpfs
  enlil_cypress_redis_volume:
      
networks:
  cypress_network:
    name: cypress_network